name: Keep Supabase active

# Supabase's free tier pauses a project after 7 days with zero activity. A hit on /health
# checks the database (see backend/main.py's health() handler), so it counts as Supabase
# activity - no secrets needed since /health is public.
#
# Once a day, not more: Render's free tier gives only 750 instance-hours/month shared
# across every free service in the workspace (~730 hours in a month), and each ping
# keeps the backend awake for its ~15-minute idle window before it sleeps again. Once a
# day costs Render about 7.5 hours/month - a 7x safety margin against Supabase's 7-day
# inactivity clock, while leaving nearly all of the free-hour budget for real traffic.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health
        run: |
          status=$(curl -s -o /tmp/health.json -w "%{http_code}" https://geometra.onrender.com/health)
          cat /tmp/health.json
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::/health returned $status instead of 200"
          fi
