# Serves the built UI and forwards the API calls to the backend container, so the browser
# only ever talks to ONE origin. That is what makes CORS a non-issue here: the backend
# refuses to start with a localhost entry in CORS_ORIGINS under APP_ENV=production, so a
# cross-origin local UI had nowhere to go.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API. "sam-backend" is the service name in docker-compose.yml, resolved on the
    # compose network; the port is the container's own, not the published one.
    location ~ ^/(chat|session|unknown-questions|health|ingest-status|admin) {
        proxy_pass http://sam-backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An answer can take well over a minute: a cold Qdrant connection, two LLM calls
        # and a moderation round. nginx's 60s default would cut the connection and show
        # the customer a gateway error while the backend was still working.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Single-page app: any other path is a route inside React, not a file on disk, so it
    # has to fall through to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The hashed build assets are immutable; index.html must never be cached or a deploy
    # leaves browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
